name: CIG03 Frozen Execution Engineering
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/cig03_*.mjs"
      - "tests-js/cig03_*.test.mjs"
      - ".github/workflows/cig03-frozen-execution.yml"
      - ".github/workflows/cig03-one-shot-test.yml"
      - "artifacts/compositional-intent-graph-v1/CIG-03_*"
      - "docs/compositional-intent-graph-v1/CIG-03_*"
      - "status/COMPOSITIONAL_INTENT_GRAPH_STATUS.yaml"
  push:
    branches: [main]
    paths:
      - "scripts/cig03_*.mjs"
      - "tests-js/cig03_*.test.mjs"
      - ".github/workflows/cig03-frozen-execution.yml"
      - ".github/workflows/cig03-one-shot-test.yml"
      - "artifacts/compositional-intent-graph-v1/CIG-03_*"
      - "docs/compositional-intent-graph-v1/CIG-03_*"
      - "status/COMPOSITIONAL_INTENT_GRAPH_STATUS.yaml"
permissions:
  contents: read
jobs:
  cig03-frozen-execution-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and semantic-free adapter / execution guard units
        run: |
          node --check scripts/cig03_execute_once.mjs
          node --check scripts/cig03_adapter.mjs
          node --check scripts/cig03_execution_guard.mjs
          node --test tests-js/cig03_adapter.test.mjs tests-js/cig03_execution_guard.test.mjs
      - name: Compile fixed TRAIN without TEST access and verify byte identity
        run: |
          mv fixtures/cig_v1/cig03_independent_test_v1.json .cig03-test-isolated.json
          node scripts/cig02e_compile.mjs
          node scripts/cig02g_compile.mjs
          cp .cig02g-index.json .cig03-index-without-test.json
          mv .cig03-test-isolated.json fixtures/cig_v1/cig03_independent_test_v1.json
          node scripts/cig02g_compile.mjs
          cmp .cig03-index-without-test.json .cig02g-index.json
      - name: Verify immutable pre-open or stored result without candidate TEST predictions
        run: |
          node scripts/cig03_execute_once.mjs --preflight
          if [ -f artifacts/compositional-intent-graph-v1/CIG-03_TEST_RESULT.json ]; then
            node scripts/cig03_execute_once.mjs --verify-result
          fi
