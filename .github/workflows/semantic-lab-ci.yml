name: Semantic Lab CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  semantic-lab-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lab
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: SEM-00 regression
        run: python -m semantic_lab.benchmark --round SEM-00 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem00-run.json
      - name: SEM-01 B0 validation
        run: python -m semantic_lab.benchmark --round SEM-01 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem01-run.json
      - name: SEM-02 retrieval validation
        run: python -m semantic_lab.benchmark --round SEM-02 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem02-run.json
      - name: SEM-03 full-catalog candidate validation
        run: python -m semantic_lab.benchmark --round SEM-03 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem03-run.json
      - name: SEM-04 router and calibration validation
        run: python -m semantic_lab.benchmark --round SEM-04 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem04-run.json
      - name: SEM-05 lifecycle, activation and privacy validation
        run: python -m semantic_lab.benchmark --round SEM-05 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem05-run.json
      - name: SEM-06 reusable personal gold infrastructure validation
        run: python -m semantic_lab.benchmark --round SEM-06 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem06-run.json
      - name: SEM-07 final evaluation engineering validation
        run: python -m semantic_lab.benchmark --round SEM-07 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem07-run.json
      - name: REM-01 public diagnostic harness validation
        run: python -m semantic_lab.benchmark --round REM-01 --lab-commit "$GITHUB_SHA" --output artifacts/ci/rem01-run.json
      - name: REM-02 public runtime evidence validation
        run: python -m semantic_lab.benchmark --round REM-02 --lab-commit "$GITHUB_SHA" --output artifacts/ci/rem02-run.json
      - name: REM-03 candidate closure validation
        run: python -m semantic_lab.benchmark --round REM-03 --lab-commit "$GITHUB_SHA" --output artifacts/ci/rem03-run.json
      - name: REM-03A plan amendment validation
        run: python -m unittest tests.test_remediation_v03_plan -v
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: semantic-lab-evidence
          path: artifacts/ci/*.json