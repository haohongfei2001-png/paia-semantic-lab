name: Semantic Lab CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  semantic-lab-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lab
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: SEM-00 regression
        run: python -m semantic_lab.benchmark --round SEM-00 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem00-run.json
      - name: SEM-01 B0 validation
        run: python -m semantic_lab.benchmark --round SEM-01 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem01-run.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: semantic-lab-evidence
          path: artifacts/ci/*.json
