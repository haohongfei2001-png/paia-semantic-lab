name: Semantic Lab CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  semantic-lab-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lab
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: SEM-00 regression
        run: python -m semantic_lab.benchmark --round SEM-00 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem00-run.json
      - name: SEM-01 B0 validation
        run: python -m semantic_lab.benchmark --round SEM-01 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem01-run.json
      - name: SEM-02 retrieval validation
        run: python -m semantic_lab.benchmark --round SEM-02 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem02-run.json
      - name: SEM-03 full-catalog candidate validation
        run: python -m semantic_lab.benchmark --round SEM-03 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem03-run.json
      - name: SEM-04 router and calibration validation
        run: python -m semantic_lab.benchmark --round SEM-04 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem04-run.json
      - name: SEM-05 lifecycle, activation and privacy validation
        run: python -m semantic_lab.benchmark --round SEM-05 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem05-run.json
      - name: SEM-06 reusable personal gold infrastructure validation
        run: python -m semantic_lab.benchmark --round SEM-06 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem06-run.json
      - name: SEM-07 final evaluation engineering validation
        run: python -m semantic_lab.benchmark --round SEM-07 --lab-commit "$GITHUB_SHA" --output artifacts/ci/sem07-run.json
      - name: REM-01 public diagnostic harness validation
        run: python -m semantic_lab.benchmark --round REM-01 --lab-commit "$GITHUB_SHA" --output artifacts/ci/rem01-run.json
      - name: REM-02 public runtime evidence validation
        run: python -m semantic_lab.benchmark --round REM-02 --lab-commit "$GITHUB_SHA" --output artifacts/ci/rem02-run.json
      - name: REM-03 candidate closure validation
        run: python -m semantic_lab.benchmark --round REM-03 --lab-commit "$GITHUB_SHA" --output artifacts/ci/rem03-run.json
      - name: REM-03A plan amendment validation
        run: python -m unittest tests.test_remediation_v03_plan -v
      - name: REM-03B plan amendment validation
        run: python -m unittest tests.test_rem03b_plan -v
      - name: REM-03B execution checkpoint validation
        run: python -m unittest tests.test_rem03b_candidates tests.test_rem03b_private_promotion -v
      - name: SCA-v0.1 catalog architecture package validation
        run: python -m unittest tests.test_catalog_architecture_v01_plan -v
      - name: SCA-01 derived semantic profile validation
        run: |
          python -m scripts.sca01_compile_profiles --output artifacts/ci/sca01-profile-compile.json
          python -m unittest tests.test_sca01_profiles -v
      - name: SCA-02 contrastive graph and synthetic validation
        run: |
          python -m scripts.sca02_validate_contrastive --output artifacts/ci/sca02-contrastive-validation.json
          python -m unittest tests.test_sca02_contrastive tests.test_sca02_status -v
      - name: SCA-03 execution checkpoint validation
        run: python -m unittest tests.test_sca03_plan tests.test_sca03_checkpoint -v
      - name: SCA-03 public synthetic diagnostics
        env:
          SCA03_PUBLIC_DIAG_NUMPY: "1"
        run: |
          python -m pip install --only-binary=:all: "numpy==2.5.3"
          python -m scripts.sca03_public_synthetic_diagnostics --output artifacts/ci/sca03-public-synthetic-diagnostics.json
          python -m unittest tests.test_sca03_public_synthetic_diagnostics tests.test_sca03_public_synthetic_report -v
      - name: BAA-01 bounded public architecture verification
        env:
          BAA01_PUBLIC_NUMPY: "1"
        run: |
          python -m pip install --only-binary=:all: "numpy==2.5.3"
          python -m scripts.baa01_public_verification --output artifacts/ci/baa01-public-verification.json
          python -m unittest tests.test_baa01_public tests.test_baa01_result -v
      - name: BAA-02 pre-evidence freeze validation
        run: python -m unittest tests.test_baa02_plan -v
      - name: PAD-01 public architecture decomposition
        env:
          PAD01_PUBLIC_RESULT: "1"
        run: |
          python -m scripts.sca03_post_failure_architecture_diagnostics --output artifacts/ci/pad01-post-failure-architecture.json
          python -m scripts.sca03_post_failure_architecture_diagnostics --output artifacts/ci/pad01-post-failure-architecture-repeat.json
          cmp artifacts/ci/pad01-post-failure-architecture.json artifacts/ci/pad01-post-failure-architecture-repeat.json
          python -m unittest tests.test_sca03_post_failure_architecture_diagnostics -v
      - name: LSR-v1 lightweight router package validation
        run: python -m unittest tests.test_lightweight_semantic_router_v1_plan -v
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: semantic-lab-evidence
          path: artifacts/ci/*.json