            const workflowPath = '.github/workflows/zmr-v1.yml';
            const allowed = new Set([workflowPath, ...docs, statusPath, resultPath, resultV03Path, resultV04Path, resultV05Path, resultV06Path, resultA7DevPath, resultA7FoldPath, resultA4TriadPath, resultA4FreshPath, resultA5FreshPath, resultA5R1FreshPath, resultA4PositiveFreshPath, resultA6ComplementFreshPath, resultA6R1RepairDevPath, resultA6R2RepairDevPath, resultA6R2FreshPath, resultH1Path, resultH1R1Path, resultA5ChartPath, resultA5ChartR1Path, a1FeatureAuditPath, ...a1BalancedResults, ...resultA4RolePaths, ...engineering, ...development]);
            // BEGIN_PINNED_PUBLIC_READER
            const reads = [];
            const byteCache = new Map();
            let rawFetches = 0;
            async function read(p, ref = head, entries = after) {
              assert(allowed.has(p), 'path not allowlisted');
              assert(p.split('/').every(part => part && part !== '.' && part !== '..'), 'canonical path required');
              assert.match(ref, /^[a-f0-9]{40}$/);
              const entry = entries.get(p);
              assert.equal(entry?.mode, '100644', 'regular file required');
              assert.equal(entry?.type, 'blob', 'blob required');
              assert(/^[a-f0-9]{40}$/.test(entry.sha), 'immutable blob required');
              assert(Number.isSafeInteger(entry.size) && entry.size >= 0 && entry.size <= 8 * 1024 * 1024, 'bounded blob required');
              if (!byteCache.has(entry.sha)) {
                // Public repository only; no installation token or archive/checkout.
                const url = 'https://raw.githubusercontent.com/' + context.repo.owner + '/' + context.repo.repo + '/' + ref + '/' + p.split('/').map(encodeURIComponent).join('/');
                const bytes = await boundedPublicTransport(url, {redirect:'error', credentials:'omit'}, async response => {
                  const body = response.body.getReader(), chunks = [];
                  let received = 0;
                  while (true) {
                    const {done, value} = await body.read();
                    if (done) break;
                    received += value.byteLength;
                    if (received > entry.size) {
                      await body.cancel();
                      throw new Error('tree/blob size mismatch: ' + p);
                    }
                    chunks.push(Buffer.from(value));
                  }
                  return Buffer.concat(chunks, received);
                }, 'blob:' + p, () => {rawFetches++;});
                assert.equal(bytes.length, entry.size, 'tree/blob size mismatch');
                assert.equal(crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex'), entry.sha, 'tree/blob digest mismatch');
                byteCache.set(entry.sha, bytes);
              }
              assert.equal(byteCache.get(entry.sha).length, entry.size, 'cached tree/blob size mismatch');
              reads.push(p);
              return Buffer.from(byteCache.get(entry.sha));
