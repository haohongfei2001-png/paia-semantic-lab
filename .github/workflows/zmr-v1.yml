name: ZMR isolated package validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/zero-model-refoundation-v1/**'
      - 'status/ZERO_MODEL_REFOUNDATION_STATUS.json'
      - 'packages/zero_model_refoundation/**'
      - 'data/zero_model_refoundation/development/**'
      - '.github/workflows/zmr-v1.yml'
      - '.github/workflows/semantic-lab-ci.yml'
      - 'README.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'docs/zero-model-refoundation-v1/**'
      - 'status/ZERO_MODEL_REFOUNDATION_STATUS.json'
      - 'packages/zero_model_refoundation/**'
      - 'data/zero_model_refoundation/development/**'
      - '.github/workflows/zmr-v1.yml'
      - '.github/workflows/semantic-lab-ci.yml'
      - 'README.md'
      - 'AGENTS.md'
permissions:
  contents: read
jobs:
  zmr-allowlist-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/github-script@v7
        id: safe
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const assert = require('node:assert/strict');
            const head = context.payload.pull_request?.head.sha || context.sha;
            const base = context.payload.pull_request?.base.sha || context.payload.before;
            assert.match(head, /^[a-f0-9]{40}$/);
            assert.match(base, /^[a-f0-9]{40}$/);
            // BEGIN_PUBLIC_TREE_READER
            // Existing contents:read action token authenticates tree metadata only; raw blobs stay credential-free.
            // One shared retry token and deadline; no sleeps, new scope or permission fallback.
            const publicTransportDeadline = Date.now() + 35000;
            let publicTransportAttempts = 0, publicTransportRetries = 0, publicTreeFetches = 0;
            const transientTransport = error => error?.name === 'TimeoutError' || error?.name === 'AbortError' || (error?.name === 'TypeError' && error?.message === 'fetch failed' && ['ECONNRESET','ETIMEDOUT','EAI_AGAIN','UND_ERR_CONNECT_TIMEOUT','UND_ERR_SOCKET'].includes(error.cause?.code));
            async function boundedPublicTransport(url, options, consume, label, onAttempt = () => {}) {
              assert.equal(options.credentials, 'omit'); assert.equal(options.redirect, 'error');
              for (let attempt = 0; attempt < 2; attempt++) {
                const remaining = publicTransportDeadline - Date.now();
                assert(remaining > 0, 'bounded public transport deadline: ' + label);
                publicTransportAttempts++; onAttempt();
                try {
                  const response = await fetch(url, {...options, signal:AbortSignal.timeout(Math.min(5000, remaining))});
                  if (!response.ok) {
                    const error = new Error('Pinned public transport HTTP ' + response.status + ': ' + label);
                    error.transientPublicHTTP = [500, 502, 503, 504].includes(response.status);
                    response.body?.cancel().catch(() => {});
                    throw error;
                  }
                  return await consume(response);
                } catch (error) {
                  const retry = attempt === 0 && publicTransportRetries === 0 && Date.now() < publicTransportDeadline && (transientTransport(error) || error.transientPublicHTTP === true);
                  core.info(JSON.stringify({classification:'ENGINEERING_PUBLIC_TRANSPORT_EVENT',label,attempt:attempt+1,error_name:error.name,error_message:error.message,retry,remaining_ms:Math.max(0,publicTransportDeadline-Date.now())}));
                  if (!retry) throw error;
                  publicTransportRetries++;
                }
              }
              throw Error('bounded public transport exhausted: ' + label);
            }
            async function tree(ref) {
              assert.match(ref, /^[a-f0-9]{40}$/);
              const url = 'https://api.github.com/repos/' + context.repo.owner + '/' + context.repo.repo + '/git/trees/' + ref + '?recursive=1';
              return boundedPublicTransport(url, {redirect:'error', credentials:'omit', headers:{accept:'application/vnd.github+json',authorization:'Bearer ' + core.getInput('github-token', {required:true})}}, async response => {
              const reader = response.body.getReader(), chunks = [];
              let size = 0;
              while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                size += value.byteLength;
                if (size > 16 * 1024 * 1024) {
                  await reader.cancel();
                  throw new Error('tree metadata too large');
                }
                chunks.push(Buffer.from(value));
              }
              const data = JSON.parse(Buffer.concat(chunks, size).toString('utf8'));
              assert.match(data.sha, /^[a-f0-9]{40}$/);
              assert.equal(data.truncated, false, 'complete metadata required');
              assert(Array.isArray(data.tree), 'tree metadata required');
              assert.equal(new Set(data.tree.map(x=>x.path)).size, data.tree.length, 'unique tree paths required');
              return new Map(data.tree.filter(x => x.type !== 'tree').map(x => [x.path, x]));
              }, 'tree:' + ref, () => {publicTreeFetches++;});
