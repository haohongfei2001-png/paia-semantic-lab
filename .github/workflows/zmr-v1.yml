            assert.match(head, /^[a-f0-9]{40}$/);
            assert.match(base, /^[a-f0-9]{40}$/);
            async function tree(ref) {
              const {data} = await github.rest.git.getTree({...context.repo, tree_sha: ref, recursive: '1'});
              assert.equal(data.truncated, false, 'complete metadata required');
              return new Map(data.tree.filter(x => x.type !== 'tree').map(x => [x.path, x]));
            }
            const before = await tree(base), after = await tree(head);
            const changed = [...new Set([...before.keys(), ...after.keys()])].filter(p => before.get(p)?.sha !== after.get(p)?.sha || before.get(p)?.mode !== after.get(p)?.mode);
