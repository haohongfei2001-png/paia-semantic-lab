name: ZMR isolated package validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/zero-model-refoundation-v1/**'
      - 'status/ZERO_MODEL_REFOUNDATION_STATUS.json'
      - 'packages/zero_model_refoundation/**'
      - 'data/zero_model_refoundation/development/**'
      - '.github/workflows/zmr-v1.yml'
      - '.github/workflows/semantic-lab-ci.yml'
      - 'README.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'docs/zero-model-refoundation-v1/**'
      - 'status/ZERO_MODEL_REFOUNDATION_STATUS.json'
      - 'packages/zero_model_refoundation/**'
      - 'data/zero_model_refoundation/development/**'
      - '.github/workflows/zmr-v1.yml'
      - '.github/workflows/semantic-lab-ci.yml'
      - 'README.md'
      - 'AGENTS.md'
permissions:
  contents: read
jobs:
  zmr-allowlist-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
