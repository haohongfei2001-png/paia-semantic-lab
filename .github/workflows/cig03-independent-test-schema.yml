name: CIG03 Independent TEST Schema
on:
  push:
    branches: [main, cig03-independent-test-freeze]
    paths:
      - 'fixtures/cig_v1/cig03_independent_test_v1.json'
      - 'scripts/cig03_*.mjs'
      - 'docs/compositional-intent-graph-v1/CIG-03_TEST_FREEZE_MANIFEST.json'
      - '.github/workflows/cig03-independent-test-schema.yml'
  pull_request:
    paths:
      - 'fixtures/cig_v1/cig03_independent_test_v1.json'
      - 'scripts/cig03_*.mjs'
      - 'docs/compositional-intent-graph-v1/CIG-03_TEST_FREEZE_MANIFEST.json'
      - '.github/workflows/cig03-independent-test-schema.yml'
permissions:
  contents: read
jobs:
  schema-provenance-score-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure scorer and validator stub units
        run: node --test scripts/cig03_score.test.mjs scripts/cig03_validate.test.mjs
      - name: Aggregate schema provenance coverage disjointness and identities
        if: always()
        run: node scripts/cig03_audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cig03-curation-audit
          path: artifacts/cig03-curation-audit.json
