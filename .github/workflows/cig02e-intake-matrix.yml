name: CIG-02E intake matrix integrity
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/cig02e_intake_matrix.mjs"
      - "scripts/cig02e_adjudication_ledger.mjs"
      - "scripts/cig02e_repeated_input_boundary_integrity.mjs"
      - "scripts/cig02e_task_topic_boundary_integrity.mjs"
      - "scripts/cig02e_neighbor_boundary_integrity.mjs"
      - "scripts/cig02e_source_coverage_reconciliation.mjs"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_SOURCE_COVERAGE_RECONCILIATION.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_NEIGHBOR_BOUNDARY_REVIEW.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_TASK_TOPIC_BOUNDARY_REVIEW.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_LEDGER_INPUT_IDENTITY_OBSERVATION.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_REPEATED_INPUT_BOUNDARY_REVIEW.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_ADJUDICATION_LEDGER.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_FULL_CATALOG_INTAKE_MATRIX.json"
      - ".github/workflows/cig02e-intake-matrix.yml"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_*SOURCE_PILOT.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_EIGHTEEN_SPARSE_EXCERPT_TRIAGE.json"
      - "semantic_profiles/v0.1/system_topics_shard_*.json"
  push:
    branches: [main]
    paths:
      - "scripts/cig02e_intake_matrix.mjs"
      - "scripts/cig02e_adjudication_ledger.mjs"
      - "scripts/cig02e_repeated_input_boundary_integrity.mjs"
      - "scripts/cig02e_task_topic_boundary_integrity.mjs"
      - "scripts/cig02e_neighbor_boundary_integrity.mjs"
      - "scripts/cig02e_source_coverage_reconciliation.mjs"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_SOURCE_COVERAGE_RECONCILIATION.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_NEIGHBOR_BOUNDARY_REVIEW.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_TASK_TOPIC_BOUNDARY_REVIEW.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_LEDGER_INPUT_IDENTITY_OBSERVATION.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_REPEATED_INPUT_BOUNDARY_REVIEW.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_ADJUDICATION_LEDGER.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_FULL_CATALOG_INTAKE_MATRIX.json"
      - ".github/workflows/cig02e-intake-matrix.yml"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_*SOURCE_PILOT.json"
      - "artifacts/compositional-intent-graph-v1/CIG-02E_EIGHTEEN_SPARSE_EXCERPT_TRIAGE.json"
      - "semantic_profiles/v0.1/system_topics_shard_*.json"
permissions:
  contents: read
concurrency:
  group: cig02e-intake-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  intake-matrix-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recompute source-only matrix and verify committed evidence
        run: node scripts/cig02e_intake_matrix.mjs
      - name: Verify consolidated source adjudication ledger
        run: node scripts/cig02e_adjudication_ledger.mjs
      - name: Verify preserved input identities and bounded profile review
        run: node scripts/cig02e_repeated_input_boundary_integrity.mjs
      - name: Verify complete task versus Topic follow-up batch
        run: node scripts/cig02e_task_topic_boundary_integrity.mjs
      - name: Verify complete remaining neighboring Topic follow-up batch
        run: node scripts/cig02e_neighbor_boundary_integrity.mjs
      - name: Recompute current source coverage without promoting gold
        run: node scripts/cig02e_source_coverage_reconciliation.mjs
