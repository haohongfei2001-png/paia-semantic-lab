name: CIG public diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cig-v1.yml"
      - "docs/compositional-intent-graph-v1/**"
      - "status/COMPOSITIONAL_INTENT_GRAPH_STATUS.yaml"
      - "runtime/compositional_intent_graph_v1/**"
      - "fixtures/cig_v1/public_dev_cig02b_v1.json"
      - "scripts/cig02b_*.mjs"
      - "artifacts/compositional-intent-graph-v1/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cig-v1.yml"
      - "docs/compositional-intent-graph-v1/**"
      - "status/COMPOSITIONAL_INTENT_GRAPH_STATUS.yaml"
      - "runtime/compositional_intent_graph_v1/**"
      - "fixtures/cig_v1/public_dev_cig02b_v1.json"
      - "scripts/cig02b_*.mjs"
      - "artifacts/compositional-intent-graph-v1/**"
permissions:
  contents: read
jobs:
  cig02b-public-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify CIG-02B source syntax
        run: |
          node --check scripts/cig02b_compile.mjs
          node --check scripts/cig02b_dev.mjs
          node --check runtime/compositional_intent_graph_v1/typed_grounder.mjs
      - name: Compile all public Topics twice and verify deterministic bytes
        run: |
          node scripts/cig02b_compile.mjs .cig02b-index.json
          node scripts/cig02b_compile.mjs .cig02b-index-repeat.json
          cmp .cig02b-index.json .cig02b-index-repeat.json
      - name: Score new public DEV only
        run: node scripts/cig02b_dev.mjs .cig02b-index.json
      - name: Verify recorded CIG-02B source digests
        run: |
          node -e 'const fs=require("fs"),crypto=require("crypto");const r=require("./artifacts/compositional-intent-graph-v1/CIG-02B_DEV_RESULT.json");const files={fixture:"fixtures/cig_v1/public_dev_cig02b_v1.json",index:".cig02b-index.json",runtime:"runtime/compositional_intent_graph_v1/typed_grounder.mjs",parser:"runtime/compositional_intent_graph_v1/goal_parser.mjs"};for(const [k,p] of Object.entries(files)){const h=crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");if(h!==r.source_sha256[k])throw Error(k+" changed after DEV evidence")}'
      - name: Preserve compiled public index
        uses: actions/upload-artifact@v4
        with:
          name: cig02b-typed-index
          path: .cig02b-index.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
