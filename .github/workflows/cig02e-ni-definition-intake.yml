name: CIG-02E fixed TRAIN definition acquisition
on:
  pull_request:
    types: [ready_for_review]
permissions:
  contents: read
  checks: read
  actions: read
concurrency:
  group: cig02e-ni-fixed-definition-source
  cancel-in-progress: false
jobs:
  fixed-public-train-definitions:
    # Run 36346751629 failed; preserve the consumed attempt. No automatic repeat.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: One verified fixed TRAIN source intake after exact-head CI gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/cig02e_ni_definition_source_job.mjs
      - name: Preserve source result or genuine failure and attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cig02e-ni-fixed-definition-source-${{ github.event.pull_request.head.sha }}
          path: source-intake/
          if-no-files-found: error
          retention-days: 90
