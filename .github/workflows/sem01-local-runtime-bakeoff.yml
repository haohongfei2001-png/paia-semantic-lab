name: SEM-01 Local Runtime Bakeoff
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  local-runtime-b0:
    if: github.head_ref == 'sem-01-runtime-bakeoff'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: Qwen/Qwen3-Embedding-0.6B
            slug: qwen3-embedding-0.6b
          - candidate: BAAI/bge-m3
            slug: bge-m3
          - candidate: nomic-ai/nomic-embed-text-v2-moe
            slug: nomic-v2-moe
          - candidate: intfloat/multilingual-e5-large-instruct
            slug: multilingual-e5-large-instruct
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Semantic Lab
        run: python -m pip install -e .
      - name: Install pinned CPU embedding runtime
        run: |
          python -m pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "sentence-transformers==5.1.1" "transformers==4.56.1" "accelerate==1.10.1" "einops==0.8.1"
      - name: Run pinned local B0
        run: |
          python -m semantic_lab.local_runtime_bakeoff             --candidate-id "${{ matrix.candidate }}"             --lab-commit "$GITHUB_SHA"             --output "artifacts/ci/local-${{ matrix.slug }}.json"
      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: sem01-local-${{ matrix.slug }}
          path: artifacts/ci/local-${{ matrix.slug }}.json
